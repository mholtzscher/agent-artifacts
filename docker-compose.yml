services:
  agent-artifacts:
    image: ghcr.io/mholtzscher/agent-artifacts:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AGENT_ARTIFACTS_WRITE_KEY: ${AGENT_ARTIFACTS_WRITE_KEY:?set AGENT_ARTIFACTS_WRITE_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: file:/data/agent-artifacts.db
      STORAGE_DIR: /data/files
    volumes:
      - ${AGENT_ARTIFACTS_DATA_DIR:-./data}:/data
