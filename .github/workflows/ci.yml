name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting and generated code
        run: |
          test -z "$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          go tool sqlc generate
          git diff --exit-code -- internal/postgres

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build container
        run: docker build .
